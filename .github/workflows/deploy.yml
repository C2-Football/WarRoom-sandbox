name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # reconai-shared/ is gitignored, so the bundled browser modules must be
      # regenerated from the canonical dhq-shared source at deploy time — otherwise
      # the Pages artifact ships a stale (or missing) copy of supabase-client.js
      # and the other shared modules. dhq-shared is the neutral shared-engine repo
      # that both War Room and ReconAI vendor; War Room no longer reads ReconAI.
      - name: Checkout dhq-shared (canonical shared engine)
        uses: actions/checkout@v4
        with:
          repository: C2-Football/dhq-shared
          path: shared-src
          # Explicit dependency revision: releases do not change under the same app commit.
          ref: 877d59df32de7bf49ee3d944b8c09e5472feebd7

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync shared engine modules
        run: SHARED_SOURCE="$GITHUB_WORKSPACE/shared-src" npm run sync:shared

      - name: Verify beta release contracts
        run: npm run test:core && npm run test:login-auth && npm run test:game-draft-table && npm run test:timeleague && npm run test:duat

      - name: Verify comparison data contracts
        run: node --test tests/player-comparison.cjs tests/team-comparison.cjs tests/team-comparison-data.cjs

      # Precompile every type="text/babel" entry (index + free-agency + draft-warroom
      # + trade-calculator) to plain JS so production no longer downloads ~3.1MB of
      # @babel/standalone or runs the in-browser JSX transform on cold load.
      - name: Precompile JSX for production (drop in-browser Babel)
        run: |
          node scripts/build-time-league-helmet-sources.cjs --check
          node scripts/build-deploy.cjs

      - name: Verify redraft forecast release
        run: |
          SHARED_SOURCE="$GITHUB_WORKSPACE/shared-src" npm run test:redraft-reliability
          SHARED_SOURCE="$GITHUB_WORKSPACE/shared-src" npm run test:redraft-reliability:build
          SHARED_SOURCE="$GITHUB_WORKSPACE/shared-src" npm run test:cbs-market
          SHARED_SOURCE="$GITHUB_WORKSPACE/shared-src" npm run test:cbs-market:build

      - name: Build Pages artifact
        run: |
          set -euo pipefail
          mkdir -p pages-artifact
          cp -R \
            index.html landing.html onboarding.html ai-settings.html upgrade.html login.html reset-password.html gift.html reminder-unsubscribe.html \
            free-agency.html draft-warroom.html trade-calculator.html draft-war-room team-comps \
            js css content reconai-shared icons *.js *.json *.webmanifest *.css *.png *.ico *.svg \
            pages-artifact/ 2>/dev/null || true
          # Overlay the precompiled entries + plain-JS modules on top of the raw
          # sources, replacing the JSX files and the index.html that loaded Babel.
          cp -R dist-deploy/. pages-artifact/
          # Both games load their own historical archives on demand.
          mkdir -p pages-artifact/data
          cp -R data/time-league data/duat pages-artifact/data/
          # A missing archive must fail the release, not ship an unplayable card.
          for asset in player-cards.json nflverse-game-logs.csv manifest.json land.svg; do
            test -s "pages-artifact/data/duat/$asset"
          done
          # Complete helmet originals are loaded directly in artist-color mode.
          mkdir -p pages-artifact/images/time-league
          cp -R images/time-league/helmets pages-artifact/images/time-league/
          cp -R images/duat pages-artifact/images/
          for asset in hero.webp horus.webp kratos.webp janus.webp excavation.webp manifest.json; do
            test -s "pages-artifact/images/duat/$asset"
          done
          rm -rf pages-artifact/**/.git pages-artifact/**/node_modules pages-artifact/**/supabase pages-artifact/**/tests

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "pages-artifact"
          name: github-pages-${{ github.run_attempt }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
