name: CI
on: [push, pull_request]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned shared engine
        uses: actions/checkout@v4
        with:
          repository: C2-Football/dhq-shared
          ref: 2caf7bed41233d61c267f4ed3cbaccc16a650285
          path: shared-src
      - name: Place dependency outside application lint scope
        run: |
          mv shared-src "$RUNNER_TEMP/dhq-shared"
          echo "SHARED_SOURCE=$RUNNER_TEMP/dhq-shared" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Sync pinned shared engine
        run: npm run sync:shared
      - run: npx eslint . --ext .js
      - name: Run all regression suites
        run: npm test
      - name: Verify comparison data contracts
        run: node --test tests/player-comparison.cjs tests/team-comparison.cjs tests/team-comparison-data.cjs
