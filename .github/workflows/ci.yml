name: CI
on: [push, pull_request]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx eslint . --ext .js
      - name: Run all regression suites
        run: npm test
      - name: Verify comparison data contracts
        run: node --test tests/player-comparison.cjs tests/team-comparison.cjs tests/team-comparison-data.cjs
