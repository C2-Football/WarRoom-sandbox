name: Validate and release C2 game functions

on:
  push:
    branches: ["main"]
    paths:
      - "supabase/**"
      - "js/shared/time-league-*.js"
      - "js/shared/game-guest.js"
      - "js/shared/woeppel-cup.js"
      - "data/time-league/**"
      - "js/duat/**"
      - "data/duat/**"
      - "scripts/build-time-league-server.cjs"
      - "scripts/build-duat-server.cjs"
      - "scripts/build-duat-data.py"
      - "scripts/c2-edge-release.py"
      - "tests/c2-edge-release*"
      - "tests/nfl-scoreboard-cache.cjs"
      - "tests/hosted-operations-reconciliation.cjs"
      - "tests/duat-*"
      - "tests/game-guest*"
      - ".github/c2-releases/**"
      - ".github/workflows/deploy-functions.yml"
  workflow_dispatch:
    inputs:
      manifest:
        description: "Committed reviewed .github/c2-releases/<name>.json"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: supabase-production
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
      - name: Checkout canonical shared engine for security contracts
        uses: actions/checkout@v4
        with:
          repository: C2-Football/dhq-shared
          path: shared-src
          ref: 61883813d6d56d0582259c8b18fc88024574f8b5
      - uses: actions/setup-node@v4
        with:
          node-version: 20.20.2
          cache: npm
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6
      - run: npm ci
      - name: Sync pinned shared modules before security contracts
        run: SHARED_SOURCE="$GITHUB_WORKSPACE/shared-src" npm run sync:shared
      - name: Verify Cup, security, billing and Vault contracts
        run: npm run test:cup && npm run test:security && npm run test:billing && npm run test:timeleague
      - name: Verify public NFL scoreboard freshness
        run: node tests/nfl-scoreboard-cache.cjs
      - name: Verify Duat contracts
        run: npm run test:duat
      - name: Verify invitation and guest access contracts
        run: npm run test:game-guests
      - name: Build Vault server runtime
        run: node scripts/build-time-league-server.cjs
      - name: Build Duat server runtime
        run: node scripts/build-duat-server.cjs
      - name: Type check all retained Edge Function sources
        run: |
          for fn in supabase/functions/*/index.ts; do
            deno check --node-modules-dir=none --no-lock "$fn"
          done

  release:
    needs: validate
    if: github.event_name == 'workflow_dispatch' && github.repository == 'C2-Football/WarRoom' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      RELEASE_MANIFEST: ${{ inputs.manifest }}
      RELEASE_HEAD: ${{ github.sha }}
      RELEASE_REPOSITORY: ${{ github.repository }}
      RELEASE_REF: ${{ github.ref }}
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20.20.2
          cache: npm
      - run: npm ci
      - name: Build the exact game runtime artifacts before scope verification
        run: node scripts/build-time-league-server.cjs && node scripts/build-duat-server.cjs
      - name: Validate committed candidate, dependency and artifact hashes
        id: plan
        run: python3 scripts/c2-edge-release.py plan --head "$RELEASE_HEAD" --event workflow_dispatch --repository "$RELEASE_REPOSITORY" --ref "$RELEASE_REF" --manifest "$RELEASE_MANIFEST"
      - uses: supabase/setup-cli@v2.0.0
        with:
          version: 2.84.2
      - name: Verify Docker for Vault local bundling
        if: steps.plan.outputs.time_league == 'true'
        run: docker info > /dev/null
      # No migration application, arbitrary SQL, or non-game deployment is
      # available here. Compatibility reads run immediately before each write;
      # all scope/bytes/schema checks run again after every deployment.
      - name: Deploy reviewed Cup
        if: steps.plan.outputs.league_cup == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          python3 scripts/c2-edge-release.py verify --head "$RELEASE_HEAD" --repository "$RELEASE_REPOSITORY" --ref "$RELEASE_REF" --manifest "$RELEASE_MANIFEST" --function league-cup
          supabase functions deploy league-cup --project-ref sxshiqyxhhifvtfqawbq --use-api --no-verify-jwt
          python3 scripts/c2-edge-release.py verify-deployed --head "$RELEASE_HEAD" --repository "$RELEASE_REPOSITORY" --ref "$RELEASE_REF" --manifest "$RELEASE_MANIFEST" --function league-cup
      - name: Deploy reviewed Vault
        if: steps.plan.outputs.time_league == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          python3 scripts/c2-edge-release.py verify --head "$RELEASE_HEAD" --repository "$RELEASE_REPOSITORY" --ref "$RELEASE_REF" --manifest "$RELEASE_MANIFEST" --function time-league
          supabase functions deploy time-league --project-ref sxshiqyxhhifvtfqawbq --use-docker --no-verify-jwt
          python3 scripts/c2-edge-release.py verify-deployed --head "$RELEASE_HEAD" --repository "$RELEASE_REPOSITORY" --ref "$RELEASE_REF" --manifest "$RELEASE_MANIFEST" --function time-league
      - name: Deploy reviewed Duat
        if: steps.plan.outputs.duat == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          python3 scripts/c2-edge-release.py verify --head "$RELEASE_HEAD" --repository "$RELEASE_REPOSITORY" --ref "$RELEASE_REF" --manifest "$RELEASE_MANIFEST" --function duat
          supabase functions deploy duat --project-ref sxshiqyxhhifvtfqawbq --use-api --no-verify-jwt
          python3 scripts/c2-edge-release.py verify-deployed --head "$RELEASE_HEAD" --repository "$RELEASE_REPOSITORY" --ref "$RELEASE_REF" --manifest "$RELEASE_MANIFEST" --function duat
